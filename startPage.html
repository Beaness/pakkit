<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>pakkit</title>
    <meta content="script-src 'self' 'unsafe-inline';" http-equiv="Content-Security-Policy"/>
    <link href="/shared.css" rel="stylesheet" type="text/css"/>
    <link href="/scrollbar.css" rel="stylesheet" type="text/css"/>
    <link href="/startPage.css" rel="stylesheet">
</head>
<body class="start-page">
<main class="setup-shell">
    <header class="setup-brand">
        <img alt="" class="app-logo app-logo-large" src="./icons/icon.png">
        <div>
            <h1 class="title">pakkit</h1>
            <p>Minecraft packet inspector</p>
        </div>
    </header>

    <section class="setup-card">
        <div class="setup-heading">
            <p class="eyebrow">New capture</p>
            <h2>Connect your client</h2>
            <p>Choose the server to inspect, then connect Minecraft to the local port.</p>
        </div>

        <form class="setup-form" onsubmit="startProxy(event)">
            <label class="field" for="version">
                <span>Game version</span>
                <select id="version">
                        <option value="auto">Detect automatically</option>
                        <option value="26.1">26.1</option>
                        <option value="1.21.11">1.21.11</option>
                        <option value="1.21.10">1.21.10</option>
                        <option value="1.21.9">1.21.9</option>
                        <option value="1.21.8">1.21.8</option>
                        <option value="1.21.6">1.21.6</option>
                        <option value="1.21.5">1.21.5</option>
                        <option value="1.21.4">1.21.4</option>
                        <option value="1.21.3">1.21.3</option>
                        <option value="1.21.1">1.21.1</option>
                        <option value="1.21">1.21</option>
                        <option value="1.20.6">1.20.6</option>
                        <option value="1.20.5">1.20.5</option>
                        <option value="1.20.4">1.20.4</option>
                        <option value="1.20.3">1.20.3</option>
                        <option value="1.20.2">1.20.2</option>
                        <option value="1.20.1">1.20.1</option>
                        <option value="1.20">1.20</option>
                        <option value="1.19.4">1.19.4</option>
                        <option value="1.19.3">1.19.3</option>
                        <option value="1.19.2">1.19.2</option>
                        <option value="1.19.1">1.19.1</option>
                        <option value="1.19">1.19</option>
                        <option value="1.18.2">1.18.2</option>
                        <option value="1.18">1.18(.1)</option>
                        <option value="1.17.1">1.17.1</option>
                        <option value="1.17">1.17</option>
                        <option value="21w07a">21w07a</option>
                        <option value="1.16.4">1.16.4/1.16.5</option>
                        <option value="1.16.3">1.16.3</option>
                        <option value="1.16.2">1.16.2</option>
                        <option value="1.16.1">1.16.1</option>
                        <option value="1.16">1.16</option>
                        <option value="20w13b">20w13b</option>
                        <option value="1.15.2">1.15.2</option>
                        <option value="1.15.1">1.15.1</option>
                        <option value="1.15">1.15</option>
                        <option value="1.14.4">1.14.4</option>
                        <option value="1.14.3">1.14.3</option>
                        <option value="1.14.1">1.14.1</option>
                        <option value="1.14">1.14</option>
                        <option value="1.13.2">1.13.2</option>
                        <option value="1.13.2-pre2">1.13.2-pre2</option>
                        <option value="1.13.2-pre1">1.13.2-pre1</option>
                        <option value="1.13.1">1.13.1</option>
                        <option value="1.13">1.13</option>
                        <option value="17w50a">17w50a</option>
                        <option value="1.12.2">1.12.2</option>
                        <option value="1.12.1">1.12.1</option>
                        <option value="1.12">1.12</option>
                        <option value="1.12-pre4">1.12-pre4</option>
                        <option value="17w18b">17w18b</option>
                        <option value="17w15a">17w15a</option>
                        <option value="1.11.2">1.11.2</option>
                        <option value="1.11">1.11</option>
                        <option value="16w35a">16w35a</option>
                        <option value="1.10.2">1.10.2</option>
                        <option value="1.10.1">1.10.1</option>
                        <option value="1.10">1.10</option>
                        <option value="1.10-pre1">1.10-pre1</option>
                        <option value="16w20a">16w20a</option>
                        <option value="1.9.4">1.9.4</option>
                        <option value="1.9.2">1.9.2</option>
                        <option value="1.9.1-pre2">1.9.1-pre2</option>
                        <option value="1.9">1.9</option>
                        <option value="15w40b">15w40b</option>
                        <option value="1.8.8">1.8.x</option>
                        <option value="1.7.10">1.7.10</option>
                </select>
            </label>

            <label class="field" for="connect-address">
                <span>Server address</span>
                <input autocomplete="off" id="connect-address" name="connect-address"
                       placeholder="play.example.net or localhost:25565" type="text" value="localhost"/>
                <small>The Minecraft server pakkit should connect to.</small>
            </label>

            <label class="field" for="listen-port">
                <span>Local listen port</span>
                <input id="listen-port" inputmode="numeric" name="listen-port" pattern="[0-9]*"
                       placeholder="25566" type="text" value="25566"/>
                <small>Connect Minecraft to <strong>localhost:<span id="listen-port-preview">25566</span></strong>.</small>
            </label>

            <div class="option-row" id="auth-row">
                <div>
                    <span class="option-title">Online-mode authentication</span>
                    <small>Use your Microsoft account when the server requires it.</small>
                </div>
                <label class="switch" for="auth-online">
                    <input id="auth-online" type="checkbox" value="auth-online"/>
                    <span class="slider round"></span>
                </label>
            </div>

            <button class="primary-button start-button" id="start" type="submit">
                <span id="start-label">Start capture</span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </form>
    </section>
</main>
<script type="module" src="/src/renderer/startPage.js"></script>
</body>
</html>
