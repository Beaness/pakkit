<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>pakkit</title>
    <meta content="script-src 'self' 'unsafe-inline';" http-equiv="Content-Security-Policy"/>
    <link href="/shared.css" rel="stylesheet" type="text/css"/>
    <link href="/scrollbar.css" rel="stylesheet" type="text/css"/>
    <link href="/startPage.css" rel="stylesheet">
</head>
<body class="start-page">
<main class="setup-shell">
    <header class="setup-brand">
        <img alt="" class="app-logo app-logo-large" src="./icons/icon.png">
        <div>
            <h1 class="title">pakkit</h1>
            <p>Minecraft packet inspector</p>
        </div>
    </header>

    <section class="setup-card">
        <div class="setup-heading">
            <p class="eyebrow">New capture</p>
            <h2>Connect your client</h2>
            <p>Choose the server to inspect, then connect Minecraft to the local port.</p>
        </div>

        <form class="setup-form" onsubmit="startProxy(event)">
            <label class="field" for="version">
                <span>Game version</span>
                <select id="version">
                    <option value="auto">Detect automatically</option>
                </select>
            </label>

            <label class="field" for="connect-address">
                <span>Server address</span>
                <input autocomplete="off" id="connect-address" name="connect-address"
                       placeholder="play.example.net or localhost:25565" type="text" value="localhost"/>
                <small>The Minecraft server pakkit should connect to.</small>
            </label>

            <label class="field" for="listen-port">
                <span>Local listen port</span>
                <input id="listen-port" inputmode="numeric" name="listen-port" pattern="[0-9]*"
                       placeholder="25566" type="text" value="25566"/>
                <small>Connect Minecraft to <strong>localhost:<span id="listen-port-preview">25566</span></strong>.</small>
            </label>

            <div class="option-row" id="auth-row">
                <div>
                    <span class="option-title">Online-mode authentication</span>
                    <small>Use your Microsoft account when the server requires it.</small>
                </div>
                <label class="switch" for="auth-online">
                    <input id="auth-online" type="checkbox" value="auth-online"/>
                    <span class="slider round"></span>
                </label>
            </div>

            <button class="primary-button start-button" id="start" type="submit">
                <span id="start-label">Start capture</span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </form>
    </section>
</main>
<script type="module" src="/src/renderer/startPage.js"></script>
</body>
</html>
